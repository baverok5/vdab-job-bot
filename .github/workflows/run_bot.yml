name: VDAB job bot

on:
  # No push trigger. It used to start a full run on every push to bot.py, and a
  # run costs real money: one day of pushing while testing started five of them,
  # two inside DeepSeek's double-rate peak window. Code changes now wait for the
  # next scheduled run, or are run by hand ("Run workflow") when that matters.
  schedule:
    # One run a day, in DeepSeek's off-peak hours. Peak billing is 01:00-04:00
    # and 06:00-10:00 UTC on weekdays, at double the rate.
    #
    # Two things make the timing awkward, both measured:
    #   * GitHub fires scheduled jobs late and unpredictably: a 23:00 slot fired
    #     at 01:47, a 17:00 slot at 21:11, an 18:00 slot at 22:28 (4h28 late);
    #   * a full run is long: reading 700 postings took 4h40m (about 24 s each,
    #     they are rendered in a browser), plus ~40 min of collection first.
    # So the slot has to leave room for ~4.5 h of delay and ~6 h of work before
    # 01:00: 13:00 + 4h30 + 6h = 23:30. A later slot would run into the peak.
    #
    # bot.py enforces this independently: DeepSeek calls stop at the start of a
    # peak window and once a run has spent its budget, so a run that does drift
    # is cut short instead of billed at double rate.
    - cron: "0 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: job-bot
  # Queue runs instead of cancelling — a long backfill run must not be killed
  # (and lose its progress) by the next scheduled run firing.
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 playwright
          python -m playwright install --with-deps chromium

      - name: Run the bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -u bot.py

      - name: Commit results
        run: |
          git config user.name "job-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/jobs.json docs/listing.json seen.json screen.json docs/prepared
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -m "Update jobs $(date -u +'%Y-%m-%d %H:%M')"
          # Resilient push: if another run (or a deploy) advanced main while we
          # worked, a plain push is rejected non-fast-forward and the whole job
          # would fail — discarding this run's results. Instead, sync and retry.
          # Use -X ours (NOT -s ours): keep OUR version only on real conflicts
          # (the data files two runs both touch) while PRESERVING unrelated
          # changes from main — e.g. a frontend/app deploy that landed mid-run.
          for i in 1 2 3 4 5; do
            git push origin HEAD:main && { echo "pushed"; exit 0; }
            echo "push rejected — syncing with remote (attempt $i)"
            git fetch origin main
            git merge -X ours --no-edit origin/main || { git merge --abort || true; }
            sleep $((RANDOM % 6 + 3))
          done
          echo "push still failing after retries" >&2
          exit 1
