name: VDAB job bot

on:
  push:
    branches: [main]
    paths:
      # Only re-run when the code changes — NOT when the bot commits its
      # own results (docs/jobs.json, seen.json), which would cause a loop.
      - "bot.py"
      - ".github/workflows/run_bot.yml"
  schedule:
    # Comprehensive runs are long (deep paging + reading each posting), so run a
    # few times a day rather than hourly. Progress is checkpointed within each run.
    #
    # Two runs a day, both in DeepSeek's off-peak hours. Peak billing is
    # 01:00-04:00 and 06:00-10:00 UTC on weekdays, at double the rate.
    #
    # The difficulty is GitHub's scheduler, which fires these 2-4 h late (a 23:00
    # slot has fired at 01:47, a 17:00 one at 21:11) and never early. A run can
    # also take up to ~95 min. So a slot is only safe if slot + 4h15m delay +
    # 1h35m run still ends before the next peak starts:
    #   10:30 -> worst case done by 16:20      (off-peak all the way)
    #   18:00 -> worst case done by 23:50      (peak resumes at 01:00)
    # That second run is the "jobs in the morning" run: it finishes the evening
    # before and the results are waiting at breakfast. A true 05:00 run is not
    # possible, since the only overnight off-peak stretch is 04:00-06:00 and a
    # run's start time floats by hours.
    #
    # bot.py enforces this independently: DeepSeek calls stop at the start of a
    # peak window and once a run has spent its budget, so a run that drifts is
    # cut short instead of billed at double rate.
    - cron: "30 10 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: job-bot
  # Queue runs instead of cancelling — a long backfill run must not be killed
  # (and lose its progress) by the next scheduled run firing.
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 playwright
          python -m playwright install --with-deps chromium

      - name: Run the bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -u bot.py

      - name: Commit results
        run: |
          git config user.name "job-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/jobs.json docs/listing.json seen.json screen.json docs/prepared
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -m "Update jobs $(date -u +'%Y-%m-%d %H:%M')"
          # Resilient push: if another run (or a deploy) advanced main while we
          # worked, a plain push is rejected non-fast-forward and the whole job
          # would fail — discarding this run's results. Instead, sync and retry.
          # Use -X ours (NOT -s ours): keep OUR version only on real conflicts
          # (the data files two runs both touch) while PRESERVING unrelated
          # changes from main — e.g. a frontend/app deploy that landed mid-run.
          for i in 1 2 3 4 5; do
            git push origin HEAD:main && { echo "pushed"; exit 0; }
            echo "push rejected — syncing with remote (attempt $i)"
            git fetch origin main
            git merge -X ours --no-edit origin/main || { git merge --abort || true; }
            sleep $((RANDOM % 6 + 3))
          done
          echo "push still failing after retries" >&2
          exit 1
